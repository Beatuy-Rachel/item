services:
  mysql:
    image: mysql:8.0
    container_name: item-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-item_tracker}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - item-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-item-tracker}-backend:latest
    container_name: item-backend
    restart: always
    environment:
      - PORT=3001
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-item_tracker}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_random_string}
      - TZ=Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - item-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-item-tracker}-frontend:latest
    container_name: item-frontend
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - item-network
    environment:
      - TZ=Asia/Shanghai

volumes:
  mysql-data:

networks:
  item-network:
    driver: bridge
